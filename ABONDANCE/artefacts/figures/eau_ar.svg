<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1120 412' width='100%' role='img' aria-labelledby='fig1-t fig1-d'><title id='fig1-t'>دورة الماء: km³ في السنة، ميزان مغلق</title><desc id='fig1-d'>التدفقات الخمسة في EQ-11. رصيد اليابس ورصيد المحيط يساويان 0.0: فالجدول مغلق بالبناء، والفرق عن الجدول المتداول مُصرَّح به في الوحدة.</desc><rect x='0' y='0' width='1120' height='412' fill='#ffffff'/><rect x='320.0' y='60' width='650.0' height='30' fill='#1f5f8b' opacity='0.85' rx='4'/><text x='306' y='81' text-anchor='end' font-family='Segoe UI,Arial' font-size='15' fill='#10263a'>تبخر المحيطات</text><text x='982' y='81' font-family='Segoe UI,Arial' font-size='15' fill='#0f3d5c'>453 000</text><rect x='320.0' y='114' width='582.6' height='30' fill='#1f5f8b' opacity='0.85' rx='4'/><text x='306' y='135' text-anchor='end' font-family='Segoe UI,Arial' font-size='15' fill='#10263a'>هطول على المحيطات</text><text x='982' y='135' font-family='Segoe UI,Arial' font-size='15' fill='#0f3d5c'>406 000</text><rect x='320.0' y='168' width='170.8' height='30' fill='#1f5f8b' opacity='0.85' rx='4'/><text x='306' y='189' text-anchor='end' font-family='Segoe UI,Arial' font-size='15' fill='#10263a'>هطول على اليابس</text><text x='982' y='189' font-family='Segoe UI,Arial' font-size='15' fill='#0f3d5c'>119 000</text><rect x='320.0' y='222' width='103.3' height='30' fill='#1f5f8b' opacity='0.85' rx='4'/><text x='306' y='243' text-anchor='end' font-family='Segoe UI,Arial' font-size='15' fill='#10263a'>تبخر اليابس</text><text x='982' y='243' font-family='Segoe UI,Arial' font-size='15' fill='#0f3d5c'>72 000</text><rect x='320.0' y='276' width='67.4' height='30' fill='#1f5f8b' opacity='0.85' rx='4'/><text x='306' y='297' text-anchor='end' font-family='Segoe UI,Arial' font-size='15' fill='#10263a'>جريان إلى البحر</text><text x='982' y='297' font-family='Segoe UI,Arial' font-size='15' fill='#0f3d5c'>47 000</text><line x1='320' y1='46' x2='320' y2='312' stroke='#5b6b7a' stroke-width='1.4'/></svg>