<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1120 412' width='100%' role='img' aria-labelledby='fig1-t fig1-d'><title id='fig1-t'>Water cycle: km³ per year, closed balance</title><desc id='fig1-d'>The five flows of EQ-11. The land balance and the ocean balance are 0.0: the table is closed by construction, and its gap with the usual table is claimed in the module.</desc><rect x='0' y='0' width='1120' height='412' fill='#ffffff'/><rect x='320.0' y='60' width='650.0' height='30' fill='#1f5f8b' opacity='0.85' rx='4'/><text x='306' y='81' text-anchor='end' font-family='Segoe UI,Arial' font-size='15' fill='#10263a'>Ocean evaporation</text><text x='982' y='81' font-family='Segoe UI,Arial' font-size='15' fill='#0f3d5c'>453 000</text><rect x='320.0' y='114' width='582.6' height='30' fill='#1f5f8b' opacity='0.85' rx='4'/><text x='306' y='135' text-anchor='end' font-family='Segoe UI,Arial' font-size='15' fill='#10263a'>Rain over the oceans</text><text x='982' y='135' font-family='Segoe UI,Arial' font-size='15' fill='#0f3d5c'>406 000</text><rect x='320.0' y='168' width='170.8' height='30' fill='#1f5f8b' opacity='0.85' rx='4'/><text x='306' y='189' text-anchor='end' font-family='Segoe UI,Arial' font-size='15' fill='#10263a'>Rain over the land</text><text x='982' y='189' font-family='Segoe UI,Arial' font-size='15' fill='#0f3d5c'>119 000</text><rect x='320.0' y='222' width='103.3' height='30' fill='#1f5f8b' opacity='0.85' rx='4'/><text x='306' y='243' text-anchor='end' font-family='Segoe UI,Arial' font-size='15' fill='#10263a'>Land evaporation</text><text x='982' y='243' font-family='Segoe UI,Arial' font-size='15' fill='#0f3d5c'>72 000</text><rect x='320.0' y='276' width='67.4' height='30' fill='#1f5f8b' opacity='0.85' rx='4'/><text x='306' y='297' text-anchor='end' font-family='Segoe UI,Arial' font-size='15' fill='#10263a'>Runoff to the sea</text><text x='982' y='297' font-family='Segoe UI,Arial' font-size='15' fill='#0f3d5c'>47 000</text><line x1='320' y1='46' x2='320' y2='312' stroke='#5b6b7a' stroke-width='1.4'/></svg>