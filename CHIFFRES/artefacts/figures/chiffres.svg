<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1120 304' width='100%' role='img' aria-labelledby='fig1-t fig1-d'><title id='fig1-t'>χ²(9) des dix chiffres, plafond déclaré</title><desc id='fig1-d'>Une barre par constante : la statistique calculée sur les dix classes de chiffres, π, e et √2. Le trait pointillé est la borne haute de l&#x27;intervalle Wilson–Hilferty déclaré par le module, pas une mesure. Aucun label n&#x27;est traduit dans le dessin.</desc><rect x='0' y='0' width='1120' height='304' fill='#ffffff'/><rect x='320.0' y='60' width='119.7' height='30' fill='#1f5f8b' opacity='0.85' rx='4'/><text x='306' y='81' text-anchor='end' font-family='Segoe UI,Arial' font-size='15' fill='#10263a'>π</text><text x='982' y='81' font-family='Segoe UI,Arial' font-size='15' fill='#0f3d5c'>5.51</text><rect x='320.0' y='114' width='206.6' height='30' fill='#166534' opacity='0.85' rx='4'/><text x='306' y='135' text-anchor='end' font-family='Segoe UI,Arial' font-size='15' fill='#10263a'>e</text><text x='982' y='135' font-family='Segoe UI,Arial' font-size='15' fill='#0f3d5c'>9.51</text><rect x='320.0' y='168' width='362.0' height='30' fill='#b45309' opacity='0.85' rx='4'/><text x='306' y='189' text-anchor='end' font-family='Segoe UI,Arial' font-size='15' fill='#10263a'>√2</text><text x='982' y='189' font-family='Segoe UI,Arial' font-size='15' fill='#0f3d5c'>16.66</text><line x1='970.0' y1='46' x2='970.0' y2='204' stroke='#b45309' stroke-width='2' stroke-dasharray='7 5'/><text x='978.0' y='40' font-family='Segoe UI,Arial' font-size='14' fill='#b45309'>29.91</text><line x1='320' y1='46' x2='320' y2='204' stroke='#5b6b7a' stroke-width='1.4'/></svg>